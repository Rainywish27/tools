<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0e2140; color: #eaf0ff;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 16px;
  }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  p.sub { color: #9fb3d8; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; width: 100%; max-width: 560px; }
  li { margin: 0 0 14px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #163463; border: 1px solid #2a4e86; border-radius: 14px;
    padding: 18px 20px; transition: background .15s, border-color .15s;
  }
  a.card:hover { background: #1b4079; border-color: #3a62a0; }
  a.card b { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  a.card span { color: #9fb3d8; font-size: .92rem; }
</style>
</head>
<body>
  <h1>Tools</h1>
  <p class="sub">Raccolta di strumenti</p>
  <ul>
    <li>
      <a class="card" href="parziali/">
        <b>Parziali della prova</b>
        <span>Durante la prova segna inizio e fine di ogni brano: esporti il file dei parziali (.md) con i tempi.</span>
      </a>
    </li>
    <li>
      <a class="card" href="taglia-prova/">
        <b>Taglia la prova in brani</b>
        <span>Carica una registrazione MP3 e il file dei parziali: taglia l'audio in brani, tutto in locale sul dispositivo.</span>
      </a>
    </li>
  </ul>
</body>
</html>
