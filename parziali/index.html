<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#002851">
<title>Parziali · Sweet ’n’ Queer</title>
<style>
/* Palette dal manuale d'identità SnQ: fucsia, giallo, turchese, blu notte */
:root {
  --notte: #002851;
  --notte-2: #0B3D74;
  --fucsia: #CD4097;
  --fucsia-ombra: #8F2A6B;
  --giallo: #F1C319;
  --giallo-pieno: #FDD93E;
  --turchese: #2EBEC0;
  --turchese-ombra: #36A9A7;
  --bordeaux: #75004B;

  --bg: var(--giallo-pieno);
  --surface: #FFFFFF;
  --ink: var(--notte);
  --muted: #34507C;
  --line: var(--notte);
  --accent: var(--fucsia);
  --on-accent: #FFFFFF;
  --danger: var(--bordeaux);
  --focus: var(--notte);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--notte);
    --surface: var(--notte-2);
    --ink: #FFF4CC;
    --muted: #B8CBE6;
    --line: #3F6AA3;
    --danger: #FF9CC8;
    --focus: var(--giallo);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Avenir", "Nunito", "Segoe UI Variable", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.35;
}
[hidden] { display: none !important; }

/* ---------- Marchio: fascia blu notte con pittogramma e scritta, sotto la riga arcobaleno ---------- */
.marchio {
  background: var(--notte);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
}
.marchio .pitto { height: 44px; width: auto; display: block; }
.marchio .scritta { height: 26px; width: auto; display: block; }
.arcobaleno {
  height: 6px;
  background: linear-gradient(90deg,
    #E2443A 0 16.66%, #F47B20 0 33.33%, var(--giallo) 0 50%,
    var(--turchese) 0 66.66%, #4169B0 0 83.33%, var(--fucsia) 0 100%);
}

/* ---------- Schermata principale: tempo, annulla, pulsante; titolo sotto ---------- */
.app {
  display: grid;
  gap: 10px;
  align-items: stretch;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas:
    "tempo segna"
    "meta meta"
    "stato stato";
  padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.tempo {
  grid-area: tempo;
  align-self: center;
  font-size: clamp(1.9rem, 8vw, 3.4rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  white-space: nowrap;
}
#btnAvvia, #btnSegna { grid-area: segna; }
.stato { grid-area: stato; margin: 0; color: var(--muted); font-size: 0.82rem; line-height: 1.2; }

/* Blocco dati del brano: annulla e altro occupano le due righe; canzone sopra, info+giudizio sotto */
.meta {
  grid-area: meta;
  display: grid;
  gap: 8px;
  align-items: stretch;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas:
    "annulla canzone canzone altro"
    "annulla nome rating altro";
}
#btnAnnulla { grid-area: annulla; align-self: stretch; }
#canzone { grid-area: canzone; }
#nome { grid-area: nome; }
#rating { grid-area: rating; }
#btnAltro { grid-area: altro; align-self: stretch; }
select {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 8px 12px;
  min-height: 46px;
  width: 100%;
  min-width: 0;
  cursor: pointer;
}
#rating { font-size: 1.3rem; text-align: center; }

button {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 8px 14px;
  min-height: 46px;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button.pieno { background: var(--notte); color: var(--giallo); border-color: var(--notte); }
@media (prefers-color-scheme: dark) {
  button.pieno { background: var(--giallo); color: var(--notte); border-color: var(--giallo); }
}
button.pericolo { color: var(--danger); border-color: var(--danger); }

/* Il pulsante principale è una caramella gommosa: bordo spesso sotto e riflesso in alto */
.segna {
  position: relative;
  border: 0;
  border-radius: 999px;
  font-size: clamp(1.05rem, 3.4vw, 1.7rem);
  font-weight: 800;
  line-height: 1.15;
  color: var(--on-accent);
  background: var(--fucsia);
  box-shadow: 0 5px 0 var(--fucsia-ombra);
  margin-bottom: 5px;
  min-height: 56px;
  transition: background-color 0.2s, box-shadow 0.1s, transform 0.1s;
}
.segna::before {
  content: "";
  position: absolute;
  left: 9%; right: 9%; top: 7px; height: 28%;
  border-radius: 999px;
  background: linear-gradient(rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0));
  pointer-events: none;
}
.segna.fine {
  background: var(--turchese);
  color: var(--notte);
  box-shadow: 0 5px 0 var(--turchese-ombra);
}
.segna:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--fucsia-ombra); }
.segna.fine:active { box-shadow: 0 1px 0 var(--turchese-ombra); }

input, textarea {
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 8px 14px;
  min-height: 46px;
  width: 100%;
  min-width: 0;
}
input::placeholder { color: var(--muted); opacity: 0.85; }
textarea { min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; line-height: 1.4; }

/* ---------- Pannello "Altro" ---------- */
.pannello {
  position: fixed;
  inset: 0;
  z-index: 10;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding: 0 max(12px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  display: grid;
  gap: 12px;
  align-content: start;
}
.pannello::before {
  content: "";
  display: block;
  height: 6px;
  margin: 0 calc(-1 * max(12px, env(safe-area-inset-right))) 0 calc(-1 * max(12px, env(safe-area-inset-left)));
  background: linear-gradient(90deg,
    #E2443A 0 16.66%, #F47B20 0 33.33%, var(--giallo) 0 50%,
    var(--turchese) 0 66.66%, #4169B0 0 83.33%, var(--fucsia) 0 100%);
  position: sticky; top: 0; z-index: 1;
}
.pannello h2 { font-size: 1.15rem; margin: 0; font-weight: 800; }
.testa { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding-top: 4px; }
.nota { color: var(--muted); font-size: 0.9rem; margin: 0; }
.avviso { color: var(--danger); font-size: 0.9rem; margin: 0; font-weight: 600; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.riga { width: 100%; text-align: left; display: grid; gap: 1px; border-radius: 16px; padding: 10px 14px; }
.riga .titolo { font-weight: 800; overflow-wrap: anywhere; }
.riga .tempi { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.88rem; }
.riga.aperto { border-color: var(--fucsia); box-shadow: inset 6px 0 0 var(--fucsia); }
.azioni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.azioni .largo { grid-column: 1 / -1; }

dialog {
  border: 0;
  border-radius: 24px;
  padding: 18px;
  width: min(94vw, 420px);
  max-height: 94vh;
  overflow-y: auto;
  background: var(--surface);
  color: var(--ink);
  border-top: 6px solid var(--fucsia);
}
dialog::backdrop { background: rgba(0, 32, 66, 0.62); }
dialog label { display: grid; gap: 4px; font-weight: 700; margin-bottom: 10px; }
dialog .bottoni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
dialog .errore { color: var(--danger); margin: 0 0 8px; min-height: 1.1em; font-size: 0.88rem; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {
  'use strict';

  // ---------- Salvataggio (stessa chiave della pagina grande) ----------
  var KEY = 'snq-parziali-v1';
  var memoria = null;
  var storageOk = true;
  try {
    localStorage.setItem(KEY + '-test', '1');
    localStorage.removeItem(KEY + '-test');
  } catch (e) { storageOk = false; }

  function leggi() {
    try {
      var v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : memoria;
    } catch (e) { return memoria; }
  }
  function salva() {
    memoria = state;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function nuovoStato() {
    return { startedAt: null, stoppedAt: null, songs: [], pending: { song: '', info: '', rating: '' } };
  }
  // Migrazione dai salvataggi vecchi: brano.name -> info, pending stringa -> oggetto
  function migra(st) {
    if (!st) return st;
    if (typeof st.pending === 'string' || st.pending == null) {
      st.pending = { song: '', info: (typeof st.pending === 'string' ? st.pending : ''), rating: '' };
    }
    if (st.pending.rating === undefined) st.pending.rating = '';
    (st.songs || []).forEach(function (s) {
      if (s.song === undefined && s.info === undefined) { s.song = ''; s.info = s.name || ''; }
      if (s.song === undefined) s.song = '';
      if (s.info === undefined) s.info = '';
      if (s.rating === undefined) s.rating = '';
    });
    return st;
  }
  var state = migra(leggi()) || nuovoStato();

  // ---------- Canzoni e giudizio ----------
  // Tenere allineata questa tabella con quella della pagina "Taglia la prova".
  var FACCE = ['', '😖', '🙁', '😐', '🙂', '🤩']; // 1..5
  function faccia(n) { n = parseInt(n, 10); return (n >= 1 && n <= 5) ? FACCE[n] : ''; }
  var BRANI = [];
  function componiNome(song, info) {
    song = (song || '').trim(); info = (info || '').trim();
    if (song && info) return song + ' - ' + info;
    return song || info || '';
  }
  function nomeBrano(s) { return componiNome(s.song, s.info); }

  // ---------- Utilità ----------
  function $(id) { return document.getElementById(id); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return p2(Math.floor(s / 3600)) + ':' + p2(Math.floor((s % 3600) / 60)) + ':' + p2(s % 60);
  }
  function parseTempo(txt) {
    txt = (txt || '').trim();
    if (!/^\d+(:\d{1,2}){0,2}$/.test(txt)) return null;
    var parti = txt.split(':').map(Number);
    var s = 0;
    for (var i = 0; i < parti.length; i++) s = s * 60 + parti[i];
    return s * 1000;
  }
  function elapsed() {
    if (!state.startedAt) return 0;
    return (state.stoppedAt != null ? state.stoppedAt : Date.now()) - state.startedAt;
  }
  function aperto() {
    var l = state.songs[state.songs.length - 1];
    return l && l.end == null ? l : null;
  }
  function vibra() { try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {} }

  function conferma(btn, testoConferma, azione) {
    var originale = btn.textContent;
    var armato = false, timer = null;
    btn.addEventListener('click', function () {
      if (!armato) {
        armato = true;
        btn.textContent = testoConferma;
        timer = setTimeout(function () { armato = false; btn.textContent = originale; }, 3500);
      } else {
        clearTimeout(timer);
        armato = false;
        btn.textContent = originale;
        azione();
      }
    });
  }

  // ---------- Schermo sempre acceso ----------
  var lock = null;
  function tieniAcceso() {
    try {
      if ('wakeLock' in navigator && state.startedAt && state.stoppedAt == null && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (l) {
          lock = l;
          l.addEventListener('release', function () { lock = null; aggiornaStato(); });
          aggiornaStato();
        }).catch(function () { aggiornaStato(); });
      }
    } catch (e) {}
    aggiornaStato();
  }
  function aggiornaStato() {
    var el = $('stato');
    if (!state.startedAt) { el.textContent = 'Pronto'; return; }
    if (state.stoppedAt != null) { el.textContent = 'Terminata'; return; }
    el.textContent = lock
      ? 'Schermo acceso'
      : 'Lo schermo può spegnersi';
  }

  // ---------- Disegno ----------
  function render() {
    var avviata = !!state.startedAt;
    var finita = state.stoppedAt != null;
    $('btnAvvia').hidden = avviata;
    $('btnSegna').hidden = !avviata || finita;
    $('btnAnnulla').hidden = !avviata || finita;
    $('nome').hidden = !avviata || finita;
    $('canzone').hidden = !avviata || finita;
    $('rating').hidden = !avviata || finita;
    $('btnTermina').hidden = !avviata || finita;
    $('btnEsporta').hidden = !avviata;
    $('btnEsporta').classList.toggle('largo', finita);
    $('avvisoSalvataggio').hidden = storageOk;

    var ap = aperto();
    var btn = $('btnSegna');
    if (ap) {
      btn.textContent = 'Fine brano ' + state.songs.length;
      btn.classList.add('fine');
    } else {
      btn.textContent = 'Inizio brano ' + (state.songs.length + 1);
      btn.classList.remove('fine');
    }

    var lista = $('lista');
    lista.innerHTML = '';
    state.songs.forEach(function (s, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'riga' + (s.end == null ? ' aperto' : '');
      var t = document.createElement('span');
      t.className = 'titolo';
      var f = faccia(s.rating);
      t.textContent = (i + 1) + '. ' + (nomeBrano(s) || 'Senza nome') + (f ? '  ' + f : '');
      var d = document.createElement('span');
      d.className = 'tempi';
      d.textContent = s.end == null
        ? 'da ' + fmt(s.start) + ', in corso'
        : 'da ' + fmt(s.start) + ' a ' + fmt(s.end) + ' (durata ' + fmt(s.end - s.start) + ')';
      b.appendChild(t); b.appendChild(d);
      b.addEventListener('click', function () { apriModifica(i); });
      li.appendChild(b);
      lista.appendChild(li);
    });
    $('vuoto').hidden = state.songs.length > 0;
    aggiornaStato();
  }
  function disegnaNome() {
    var ap = aperto();
    var dati = ap || state.pending || { song: '', info: '', rating: '' };
    $('canzone').value = dati.song || '';
    $('nome').value = dati.info || '';
    $('rating').value = dati.rating || '';
  }

  // ---------- Segnare ----------
  var ultimoSegno = 0;
  function segna() {
    if (!state.startedAt || state.stoppedAt != null) return;
    var ora = Date.now();
    if (ora - ultimoSegno < 700) return;
    ultimoSegno = ora;
    var t = elapsed();
    var ap = aperto();
    if (ap) {
      ap.end = t;
    } else {
      var p = state.pending || { song: '', info: '', rating: '' };
      state.songs.push({ id: ora, song: p.song || '', info: p.info || '', rating: p.rating || '', start: t, end: null });
      state.pending = { song: '', info: '', rating: '' };
    }
    salva(); render(); disegnaNome(); vibra();
  }

  $('btnAvvia').addEventListener('click', function () {
    state.startedAt = Date.now();
    state.stoppedAt = null;
    salva(); render(); disegnaNome(); tieniAcceso(); vibra();
  });
  $('btnSegna').addEventListener('click', function (e) { segna(); e.currentTarget.blur(); });

  function aggiornaCampo(campo, valore) {
    var ap = aperto();
    (ap || state.pending)[campo] = valore;
    salva();
    if (ap) render();
  }
  $('canzone').addEventListener('change', function (e) { aggiornaCampo('song', e.target.value); });
  $('nome').addEventListener('input', function (e) { aggiornaCampo('info', e.target.value); });
  $('rating').addEventListener('change', function (e) { aggiornaCampo('rating', e.target.value); });

  $('btnAnnulla').addEventListener('click', function () {
    var ap = aperto();
    if (ap) {
      state.pending = { song: ap.song || '', info: ap.info || '', rating: ap.rating || '' };
      state.songs.pop();
    } else if (state.songs.length) {
      state.songs[state.songs.length - 1].end = null;
    }
    salva(); render(); disegnaNome();
  });

  // ---------- Pannello Altro ----------
  function apriPannello() { $('pannello').hidden = false; $('pannello').scrollTop = 0; }
  function chiudiPannello() { $('pannello').hidden = true; }
  $('btnAltro').addEventListener('click', apriPannello);
  $('btnChiudi').addEventListener('click', chiudiPannello);

  conferma($('btnTermina'), 'Tocca ancora per terminare', function () {
    var t = elapsed();
    var ap = aperto();
    if (ap) ap.end = t;
    state.stoppedAt = Date.now();
    salva(); render(); apriExport(); apriPannello();
    if (lock) { try { lock.release(); } catch (e) {} }
  });

  // ---------- Modifica ----------
  var indiceModifica = -1;
  function apriModifica(i) {
    indiceModifica = i;
    var s = state.songs[i];
    $('dCanzone').value = s.song || '';
    $('dNome').value = s.info || '';
    $('dRating').value = s.rating || '';
    $('dInizio').value = fmt(s.start);
    $('dFine').value = s.end == null ? '' : fmt(s.end);
    $('dErrore').textContent = '';
    $('dlg').showModal();
  }
  $('dAnnulla').addEventListener('click', function () { $('dlg').close(); });
  $('dSalva').addEventListener('click', function () {
    var ini = parseTempo($('dInizio').value);
    var fineTxt = $('dFine').value.trim();
    var fin = fineTxt === '' ? null : parseTempo(fineTxt);
    if (ini == null || (fineTxt !== '' && fin == null)) {
      $('dErrore').textContent = 'Scrivi i tempi come ore:minuti:secondi, per esempio 00:03:12.';
      return;
    }
    if (fin != null && fin <= ini) {
      $('dErrore').textContent = 'La fine deve venire dopo l\u2019inizio.';
      return;
    }
    var s = state.songs[indiceModifica];
    s.song = $('dCanzone').value;
    s.info = $('dNome').value.trim();
    s.rating = $('dRating').value;
    s.start = ini;
    s.end = fin;
    salva(); render(); disegnaNome();
    if (!$('export').hidden) apriExport();
    $('dlg').close();
  });
  conferma($('dElimina'), 'Tocca ancora per eliminare', function () {
    state.songs.splice(indiceModifica, 1);
    salva(); render(); disegnaNome();
    if (!$('export').hidden) apriExport();
    $('dlg').close();
  });

  // ---------- Esportazione ----------
  function pulisci(t) { return (t || '').replace(/[|\r\n]+/g, ' ').trim(); }
  function nomeFile() {
    var d = new Date(state.startedAt || Date.now());
    return 'parziali-' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '.md';
  }
  function creaMarkdown() {
    var d = new Date(state.startedAt || Date.now());
    var ts = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' +
             p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
    var o = '# Parziali della prova\n\n';
    o += 'Avvio registrazione: ' + ts + '\n';
    o += 'Durata: ' + fmt(elapsed()) + '\n\n';
    o += '| N | Nome | Inizio | Fine | Giudizio |\n|---|------|--------|--------|----------|\n';
    state.songs.forEach(function (s, i) {
      o += '| ' + (i + 1) + ' | ' + pulisci(nomeBrano(s)) + ' | ' + fmt(s.start) + ' | ' + (s.end == null ? '' : fmt(s.end)) + ' | ' + (s.rating || '') + ' |\n';
    });
    return o;
  }
  function apriExport() {
    $('testo').value = creaMarkdown();
    $('esito').textContent = '';
    $('export').hidden = false;
  }
  $('btnEsporta').addEventListener('click', function () {
    apriExport();
    $('export').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('btnCopia').addEventListener('click', function () {
    var t = $('testo');
    var fatto = function () { $('esito').textContent = 'Testo copiato.'; };
    var ripiego = function () {
      t.focus(); t.select();
      try { document.execCommand('copy'); fatto(); }
      catch (e) { $('esito').textContent = 'Tieni premuto sul testo per copiarlo.'; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t.value).then(fatto, ripiego);
    } else { ripiego(); }
  });
  $('btnScarica').addEventListener('click', function () {
    var blob = new Blob([$('testo').value], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nomeFile();
    document.body.appendChild(a);
    a.click();
    a.remove();
    $('esito').textContent = 'File scaricato: ' + nomeFile();
  });
  conferma($('btnNuova'), 'Tocca ancora: cancella tutti i tempi', function () {
    state = nuovoStato();
    salva();
    $('export').hidden = true;
    render(); disegnaNome();
    $('tempo').textContent = fmt(0);
    chiudiPannello();
  });

  // ---------- Tastiera e pedali Bluetooth ----------
  var TASTI = { 'Enter': 1, ' ': 1, 'PageDown': 1, 'PageUp': 1, 'ArrowRight': 1, 'ArrowLeft': 1, 'ArrowDown': 1, 'ArrowUp': 1, 'MediaTrackNext': 1 };
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.closest('dialog'))) return;
    if (t && t.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if (!$('pannello').hidden) return;
    if (!TASTI[e.key]) return;
    if (!state.startedAt || state.stoppedAt != null) return;
    e.preventDefault();
    segna();
  });

  // ---------- Orologio ----------
  function tick() { $('tempo').textContent = fmt(elapsed()); }
  setInterval(tick, 250);
  document.addEventListener('visibilitychange', function () { tick(); tieniAcceso(); });
  window.addEventListener('pageshow', function () { tick(); tieniAcceso(); });

  // ---------- Popolamento menu ----------
  function opzioniRating(sel) {
    sel.innerHTML = '';
    var v = document.createElement('option'); v.value = ''; v.textContent = '—'; sel.appendChild(v);
    for (var n = 1; n <= 5; n++) {
      var o = document.createElement('option'); o.value = String(n); o.textContent = FACCE[n]; sel.appendChild(o);
    }
  }
  function opzioniCanzone(sel, lista) {
    var cur = sel.value;
    sel.innerHTML = '';
    var v = document.createElement('option'); v.value = ''; v.textContent = '—'; sel.appendChild(v);
    lista.forEach(function (nome) {
      var o = document.createElement('option'); o.value = nome; o.textContent = nome; sel.appendChild(o);
    });
    sel.value = cur;
  }
  opzioniRating($('rating')); opzioniRating($('dRating'));
  opzioniCanzone($('canzone'), BRANI); opzioniCanzone($('dCanzone'), BRANI);
  // La lista canzoni vive in brani.md, accanto alla pagina: un titolo per riga.
  fetch('brani.md').then(function (r) { return r.ok ? r.text() : ''; }).then(function (txt) {
    BRANI = txt.split(/\r?\n/)
      .map(function (s) { return s.replace(/^\s*-\s*/, '').replace(/,\s*$/, '').trim(); })
      .filter(function (s) { return s && s.charAt(0) !== '#'; });
    opzioniCanzone($('canzone'), BRANI); opzioniCanzone($('dCanzone'), BRANI);
    disegnaNome();
  }).catch(function () {});

  // ---------- Avvio pagina ----------
  render(); disegnaNome(); tick(); tieniAcceso();
  if (state.stoppedAt != null) { apriExport(); apriPannello(); }
})();
</script>
</body>
</html>
